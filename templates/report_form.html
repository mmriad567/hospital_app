{% extends "base.html" %}

{% block title %}নতুন রিপোর্ট - Diagnostic Center{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">নতুন রিপোর্ট তৈরি</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/reports/new">

                    <div class="mb-3">
                        <label class="form-label">রোগী <span class="text-danger">*</span></label>
                        <select name="patient_id" class="form-select" required>
                            <option value="">-- রোগী বেছে নিন --</option>
                            {% for p in patients %}
                            <option value="{{ p.id }}">{{ p.name }} — {{ p.phone }} ({{ p.age }} বছর)</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">টেস্টসমূহ <span class="text-danger">*</span></label>
                        <div class="border rounded p-3" style="max-height: 300px; overflow-y: auto;">
                            {% for t in tests %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       name="test_ids" value="{{ t.id }}" id="test_{{ t.id }}">
                                <label class="form-check-label w-100" for="test_{{ t.id }}">
                                    <strong>{{ t.test_name }}</strong>
                                    <span class="badge bg-info text-dark ms-2">{{ t.category }}</span>
                                    <span class="float-end">৳{{ t.price }}</span>
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                        <small class="text-muted">একাধিক টেস্ট বেছে নিতে পারবেন</small>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/reports" class="btn btn-secondary">বাতিল</a>
                        <button type="submit" class="btn btn-success">রিপোর্ট তৈরি করুন</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
